<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>พนักงานสาขา — ระบบติดตามงานซ่อม</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #fff; --border: #e2e0d8;
    --text: #1a1a18; --muted: #6b6a66; --accent: #1a1a18;
    --danger: #c0392b; --radius: 12px; --font: 'Sarabun', sans-serif;
  }
  body { background: var(--bg); font-family: var(--font); color: var(--text); min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .brand { font-size: 15px; font-weight: 700; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .back-link { font-size: 12px; color: var(--muted); text-decoration: none; border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px; }
  .back-link:hover { background: var(--bg); }
  .logout-btn { font-size: 12px; color: var(--muted); background: none; border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px; cursor: pointer; display: none; }
  .logout-btn:hover { background: var(--bg); }

  .main { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }

  /* Login */
  #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; }
  .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .login-box h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .login-box .sub { font-size: 13px; color: var(--muted); margin-bottom: 1.5rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  .field select, .field input { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 15px; font-family: var(--font); outline: none; background: var(--bg); }
  .field select:focus, .field input:focus { border-color: var(--accent); background: var(--surface); }
  .btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-family: var(--font); font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.85; }
  .err-msg { color: var(--danger); font-size: 13px; margin-top: 8px; text-align: center; }

  /* Staff panel */
  #staff-panel { display: none; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 10px; }
  .panel-title { font-size: 17px; font-weight: 700; }
  .branch-badge { background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }

  /* Search */
  .search-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  .search-row { display: flex; gap: 8px; }
  .search-input { flex: 1; border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 15px; font-family: var(--font); outline: none; background: var(--bg); }
  .search-input:focus { border-color: var(--accent); background: var(--surface); }
  .search-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 18px; font-size: 14px; font-family: var(--font); font-weight: 600; cursor: pointer; white-space: nowrap; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; margin-bottom: -1px; font-family: var(--font); }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }

  /* Table */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .table-header { padding: 10px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 14px; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; background: var(--bg); border-bottom: 1px solid var(--border); }
  td { padding: 11px 14px; font-size: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; transition: background 0.1s; }
  tbody tr:hover td { background: var(--bg); }

  /* Badge */
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
  .modal-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
  .modal-jobno { font-size: 20px; font-weight: 700; }
  .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); padding: 0 4px; }
  .info-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
  .ik { color: var(--muted); white-space: nowrap; }
  .iv { font-weight: 500; }
  .repair-note { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* State */
  .state-box { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 540px) {
    th.hide-sm, td.hide-sm { display: none; }
    .main { padding: 1rem 0.75rem; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
const SUPABASE_URL = 'https://etggtjqnkyzjqmiwokth.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_sR2v12bmK9k-oHzOB9o6Ig_PGBL6ZbY';

// รหัสผ่านแต่ละสาขา shop_no: password
const BRANCH_PASSWORDS = {
  '02': '@Pin02',
  '03': '@Lad03',
  '05': '@Fut05',
  '09': '@Fas09',
  '12': '@Wor12',
  '16': '@Meg16',
  '21': '@Eas21',
  '22': '@Ico22',
  '23': '@Wes23',
  '25': '@Par25',
  '00': '@Off00',
};

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_STYLE = {
  'เสร็จและจัดส่งแล้ว':   { bg:'#e8f5e0', color:'#2e6b10' },
  'งานเสร็จรอมารับ':       { bg:'#d4f2e7', color:'#0a6644' },
  'กำลังซ่อม':             { bg:'#ddeeff', color:'#1254a0' },
  'กำลังซ่อม+ส่งทำ':       { bg:'#ddeeff', color:'#1254a0' },
  'เทียบเวลา':             { bg:'#ddeeff', color:'#1254a0' },
  'รอคิวช่าง':             { bg:'#fff0d4', color:'#8a4a00' },
  'รอเช็ค':                { bg:'#fff0d4', color:'#7a4500' },
  'สั่งแล้วรออะไหล่':      { bg:'#fff0d4', color:'#7a4500' },
  'รอหาอะหลั่ย':           { bg:'#fff0d4', color:'#7a4500' },
  'ส่งทำ':                 { bg:'#fff0d4', color:'#7a4500' },
  'รอ Confirm':            { bg:'#fff0d4', color:'#7a4500' },
  'ไม่ซ่อมรับคืนแล้ว':     { bg:'#f0eeea', color:'#666' },
  'รอคืนลูกค้าไม่ซ่อม':   { bg:'#f0eeea', color:'#666' },
  'เก็บที่ออฟฟิศ':         { bg:'#f0eeea', color:'#666' },
  'คืนไม่มีอะไหล่':        { bg:'#fde8e8', color:'#9b2222' },
  'ติดต่อไม่ได้':           { bg:'#fde8e8', color:'#9b2222' },
};

const ACTIVE_STATUSES = ['กำลังซ่อม','รอคิวช่าง','รอเช็ค','สั่งแล้วรออะไหล่','ส่งทำ','รอหาอะหลั่ย','รอ Confirm','เทียบเวลา','กำลังซ่อม+ส่งทำ','งานเสร็จรอมารับ','เก็บที่ออฟฟิศ','ติดต่อไม่ได้'];

function badge(s) {
  const st = STATUS_STYLE[s] || { bg:'#f0eeea', color:'#666' };
  return `<span class="badge" style="background:${st.bg};color:${st.color};">${s || '—'}</span>`;
}

let currentShop = null;
let currentTab = 'active';
let allJobs = [];

function doStaffLogin() {
  const shop = document.getElementById('shop-select').value;
  const pwd = document.getElementById('staff-pwd').value;
  const err = document.getElementById('login-err');

  if (!shop) { err.textContent = 'กรุณาเลือกสาขา'; return; }
  if (!pwd) { err.textContent = 'กรุณาใส่รหัสผ่าน'; return; }
  if (BRANCH_PASSWORDS[shop] !== pwd) { err.textContent = 'รหัสผ่านไม่ถูกต้อง'; return; }

  currentShop = shop;
  sessionStorage.setItem('staff_shop', shop);

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('staff-panel').style.display = 'block';
  document.getElementById('logout-btn').style.display = 'block';
  const branchName = document.getElementById('shop-select').options[document.getElementById('shop-select').selectedIndex].text;
  document.getElementById('branch-badge').textContent = branchName;
  document.getElementById('panel-title').textContent = `งานซ่อม ${branchName}`;

  loadJobs();
}

function doLogout() {
  sessionStorage.removeItem('staff_shop');
  location.reload();
}

document.getElementById('staff-pwd').addEventListener('keydown', e => { if (e.key === 'Enter') doStaffLogin(); });

// Auto-login ถ้ายัง session อยู่
const savedShop = sessionStorage.getItem('staff_shop');
if (savedShop) {
  currentShop = savedShop;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('staff-panel').style.display = 'block';
  document.getElementById('logout-btn').style.display = 'block';
  const BRANCH_NAMES = {'02':'Central ปิ่นเกล้า','03':'Central ลาดพร้าว','05':'Future Park Rangsit','09':'Fashion Island','12':'Central World','16':'Mega Bangna','21':'Eastville','22':'Icon Siam','23':'WestGate','25':'Central Park','00':'สำนักงานกลาง'};
  const savedName = BRANCH_NAMES[savedShop] || `สาขา ${savedShop}`;
  document.getElementById('branch-badge').textContent = savedName;
  document.getElementById('panel-title').textContent = `งานซ่อม ${savedName}`;
  loadJobs();
}

async function loadJobs() {
  const div = document.getElementById('jobs-container');
  div.innerHTML = `<div class="state-box"><div class="spinner"></div><div>กำลังโหลดข้อมูล...</div></div>`;

  const { data, error } = await sb.from('repair_jobs')
    .select('*')
    .eq('shop_no', currentShop)
    .order('jobdate', { ascending: false });

  if (error) {
    div.innerHTML = `<div class="state-box">เกิดข้อผิดพลาด: ${error.message}</div>`;
    return;
  }

  allJobs = data || [];
  renderJobs();
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderJobs();
}

function doSearch() {
  renderJobs(document.getElementById('search-q').value.trim().toLowerCase());
}

document.getElementById('search-q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

function renderJobs(q = '') {
  let jobs = allJobs;
  if (currentTab === 'active') {
    jobs = jobs.filter(r => ACTIVE_STATUSES.includes(r.finaldesc));
  }
  if (q) {
    jobs = jobs.filter(r =>
      (r.jobno || '').toLowerCase().includes(q) ||
      (r.clientname || '').toLowerCase().includes(q)
    );
  }

  const div = document.getElementById('jobs-container');
  if (!jobs.length) {
    div.innerHTML = `<div class="state-box">ไม่พบรายการ${currentTab === 'active' ? 'งานที่กำลังดำเนินการ' : ''}</div>`;
    return;
  }

  const rows = jobs.map(r => `
    <tr onclick="openModal('${r.jobno.replace(/'/g,"\\'")}')">
      <td style="font-weight:600;">${r.jobno}</td>
      <td>${r.clientname || '—'}</td>
      <td class="hide-sm" style="color:var(--muted);font-size:13px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.category || '—'}</td>
      <td>${badge(r.finaldesc)}</td>
      <td class="hide-sm" style="color:var(--muted);font-size:13px;">${r.jobdate || '—'}</td>
    </tr>`).join('');

  div.innerHTML = `
    <div class="table-wrap">
      <div class="table-header">
        <span>พบ <strong>${jobs.length}</strong> รายการ</span>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr>
            <th>Job No</th><th>ลูกค้า</th>
            <th class="hide-sm">นาฬิกา</th>
            <th>สถานะ</th>
            <th class="hide-sm">วันที่รับ</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function openModal(jobno) {
  const r = allJobs.find(x => x.jobno === jobno);
  if (!r) return;
  document.getElementById('m-jobno').textContent = r.jobno;
  document.getElementById('m-cat').textContent = r.category || '';
  document.getElementById('m-badge').innerHTML = badge(r.finaldesc);
  const details = [
    ['ลูกค้า', r.clientname], ['โทรศัพท์', r.phone],
    ['วันที่รับงาน', r.jobdate], ['วันที่เสร็จ', r.finishdate],
    ['Serial No.', r.serialno],
    ['ราคาประเมิน', r.estimate ? '฿'+parseFloat(r.estimate||0).toLocaleString('th-TH') : null],
  ].filter(([,v]) => v);
  document.getElementById('m-grid').innerHTML = details.map(([k,v]) => `<div class="ik">${k}</div><div class="iv">${v}</div>`).join('');
  const rep = [r.actdesc1, r.actdesc2].filter(Boolean).join(' · ');
  const repDiv = document.getElementById('m-repair');
  repDiv.style.display = rep ? 'block' : 'none';
  repDiv.innerHTML = rep ? `<strong style="color:var(--text);">รายการซ่อม:</strong> ${rep}` : '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
