<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทดสอบถ่ายรูป v2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;padding:1rem;background:#f5f4f0;}
.box{background:#fff;border-radius:12px;padding:1rem;margin-bottom:1rem;border:1px solid #ddd;}
h3{font-size:13px;color:#666;margin-bottom:8px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
/* วิธี A: input ใน label display:none */
.btn-a{border:2px dashed #aaa;border-radius:8px;padding:14px;text-align:center;cursor:pointer;display:block;background:#fff;}
/* วิธี B: input ขนาด 0 opacity 0 แต่ไม่ display:none */
.btn-b-wrap{position:relative;border:2px dashed #aaa;border-radius:8px;padding:14px;text-align:center;cursor:pointer;overflow:hidden;}
.btn-b-input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
/* วิธี C: แสดง input ตรงๆ */
.native-input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;}
#log{background:#111;color:#0f0;padding:10px;border-radius:8px;font-size:11px;font-family:monospace;min-height:60px;white-space:pre-wrap;word-break:break-all;}
.thumb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;}
.thumb-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;}
</style>
</head>
<body>

<div class="box">
<h3>A: input[display:none] ใน label</h3>
<div class="grid">
  <label class="btn-a">
    📷 ถ่ายรูป
    <input type="file" accept="image/*" capture="camera" style="display:none" onchange="show(this,'gA')">
  </label>
  <label class="btn-a">
    🖼 คลัง
    <input type="file" accept="image/*" style="display:none" onchange="show(this,'gA')">
  </label>
</div>
<div class="thumb-grid" id="gA"></div>
</div>

<div class="box">
<h3>B: input opacity:0 ทับ div</h3>
<div class="grid">
  <div class="btn-b-wrap">
    📷 ถ่ายรูป
    <input class="btn-b-input" type="file" accept="image/*" capture="camera" onchange="show(this,'gB')">
  </div>
  <div class="btn-b-wrap">
    🖼 คลัง
    <input class="btn-b-input" type="file" accept="image/*" onchange="show(this,'gB')">
  </div>
</div>
<div class="thumb-grid" id="gB"></div>
</div>

<div class="box">
<h3>C: input แสดงตรงๆ (native)</h3>
<input class="native-input" type="file" accept="image/*" capture="camera" onchange="show(this,'gC')">
<div class="thumb-grid" id="gC"></div>
</div>

<div class="box">
<h3>Log</h3>
<div id="log">รอผล...</div>
</div>

<script>
document.querySelectorAll('label,div.btn-b-wrap').forEach(el=>{
  el.addEventListener('click',()=>log('clicked: '+el.className.substring(0,20)));
});
document.querySelectorAll('input[type=file]').forEach(inp=>{
  inp.addEventListener('change',()=>log('input changed files:'+inp.files.length));
});
function show(input,gid){
  log('show called, files:'+input.files.length);
  const g=document.getElementById(gid);
  Array.from(input.files).forEach(f=>{
    const img=document.createElement('img');
    const r=new FileReader();
    r.onload=e=>img.src=e.target.result;
    r.readAsDataURL(f);
    g.appendChild(img);
  });
}
function log(msg){
  const el=document.getElementById('log');
  el.textContent=new Date().toLocaleTimeString()+' '+msg+'\n'+el.textContent;
}
log('loaded | '+navigator.userAgent.substring(0,60));
</script>
</body>
</html>
