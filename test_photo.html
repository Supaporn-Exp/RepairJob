<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทดสอบถ่ายรูป</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;padding:1rem;background:#f5f4f0;}
.box{background:#fff;border-radius:12px;padding:1rem;margin-bottom:1rem;border:1px solid #e2e0d8;}
h3{font-size:14px;margin-bottom:8px;color:#666;}
.zone{border:2px dashed #ccc;border-radius:8px;padding:1.5rem;text-align:center;cursor:pointer;margin-bottom:8px;background:#fff;}
.zone:active{background:#f0f0f0;}
button{width:100%;padding:12px;border-radius:8px;border:none;background:#1a1a18;color:#fff;font-size:15px;cursor:pointer;margin-bottom:8px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;}
.thumb{aspect-ratio:1;border-radius:8px;overflow:hidden;}
.thumb img{width:100%;height:100%;object-fit:cover;}
#log{background:#000;color:#0f0;padding:10px;border-radius:8px;font-size:12px;font-family:monospace;min-height:80px;white-space:pre-wrap;}
</style>
</head>
<body>

<div class="box">
<h3>วิธี 1 — label + input (แนะนำ)</h3>
<label for="f1">
<div class="zone">📷 กดที่นี่เพื่อถ่ายรูป (label)</div>
</label>
<input type="file" id="f1" accept="image/*" multiple style="display:none" onchange="showPhotos(this,'g1');log('f1 changed: '+this.files.length+' files')">
<div class="grid" id="g1"></div>
</div>

<div class="box">
<h3>วิธี 2 — input แสดงตรงๆ ไม่ซ่อน</h3>
<input type="file" id="f2" accept="image/*" multiple onchange="showPhotos(this,'g2');log('f2 changed: '+this.files.length+' files')" style="margin-bottom:8px;width:100%;">
<div class="grid" id="g2"></div>
</div>

<div class="box">
<h3>วิธี 3 — button onclick → input.click()</h3>
<button onclick="document.getElementById('f3').click();log('f3 button clicked')">📷 กดปุ่มถ่ายรูป</button>
<input type="file" id="f3" accept="image/*" multiple style="display:none" onchange="showPhotos(this,'g3');log('f3 changed: '+this.files.length+' files')">
<div class="grid" id="g3"></div>
</div>

<div class="box">
<h3>วิธี 4 — input opacity:0 ทับปุ่ม</h3>
<div style="position:relative;display:inline-block;width:100%;">
<div class="zone">📷 กดที่นี่ (input ทับ)</div>
<input type="file" id="f4" accept="image/*" multiple onchange="showPhotos(this,'g4');log('f4 changed: '+this.files.length+' files')" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;">
</div>
<div class="grid" id="g4"></div>
</div>

<div class="box">
<h3>Log</h3>
<div id="log">รอการทดสอบ...</div>
</div>

<script>
function log(msg){
  const el=document.getElementById('log');
  el.textContent+='\n'+new Date().toLocaleTimeString()+' '+msg;
}
function showPhotos(input,gridId){
  const grid=document.getElementById(gridId);
  Array.from(input.files).forEach(file=>{
    const div=document.createElement('div');div.className='thumb';
    const img=document.createElement('img');
    const reader=new FileReader();
    reader.onload=e=>{img.src=e.target.result;};
    reader.readAsDataURL(file);
    div.appendChild(img);grid.appendChild(div);
  });
}
log('Page loaded — UA: '+navigator.userAgent.substring(0,80));
</script>
</body>
</html>
